syntax = "proto3";

package securelayer.v1;

option java_multiple_files = true;
option java_package = "com.securelayer.proto.v1";

import "securelayer/v1/common.proto";

service DataPlaneService {
    rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
}

message AuthorizeRequest {
    TenantRef tenant = 1;
    Principal principal = 2;
    string action = 3;
    string resource = 4;
    bytes request_hash_sha256 = 5;
    ProtocolEnvelope envelope = 6;
    Authentication authentication = 7;
    RequestContext context = 8;
    Integrity integrity = 9;
}

message AuthorizeResponse {
    bool allowed = 1;
    string policy_name = 2;
    int32 policy_version = 3;
    ProtocolEnvelope envelope = 4;
    SecurityDecision decision = 5;
    Integrity integrity = 6;
}

